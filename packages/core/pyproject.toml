[project]
name = "thebridge-core"
version = "0.1.0"
description = "可插拔的 Android 视觉自动化核心"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.2",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
