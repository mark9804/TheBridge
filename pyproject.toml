[project]
name = "thebridge"
version = "0.1.0"
description = "基于 TheBridge Core 的碧蓝航线自动化应用"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.116",
    "numpy>=2.2",
    "pillow>=12.3",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "thebridge-core==0.1.0",
    "uvicorn>=0.35",
]

[project.scripts]
thebridge = "thebridge.__main__:main"

[project.entry-points."thebridge.plugins"]
android-adb = "thebridge.builtin.android_adb.plugin:create_plugin"
azurlane-cn = "thebridge.builtin.azurlane_cn.plugin:create_plugin"
azurlane-campaign = "thebridge.builtin.azurlane_cn.campaign:create_plugin"
azurlane-exercise = "thebridge.builtin.azurlane_cn.exercise_locator:create_plugin"
macos-vision = "thebridge.builtin.macos_vision.plugin:create_plugin"
text-locator = "thebridge.builtin.text_locator.plugin:create_plugin"

[project.optional-dependencies]
macos-vision = [
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.uv.sources]
thebridge-core = { workspace = true }

[tool.uv.workspace]
members = ["packages/core"]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
